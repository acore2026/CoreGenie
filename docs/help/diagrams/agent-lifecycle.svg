<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="title">
  <title id="title">一次 Agent 任务从提交、调度、SSE 推送到恢复的完整生命周期</title>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r=".85" fill="#d7d0bd"/>
    </pattern>
    <marker id="tip" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="m2 1 8 5-8 5" fill="none" stroke="#37444a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="tip-dashed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="m2 1 8 5-8 5" fill="none" stroke="#0369a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", "WenQuanYi Zen Hei", sans-serif; fill: #1e293b; }
      .m { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace; fill: #334155; }
      .h { font-size: 14px; font-weight: 700; }
      .s { font-size: 11.5px; fill: #475569; }
      .lbl { font-size: 11px; font-weight: 600; fill: #1e293b; }
      .badge { font-size: 11px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect width="100%" height="100%" rx="16" fill="#fdfcf8"/>
  <rect width="100%" height="100%" rx="16" fill="url(#dots)"/>

  <!-- 4 Lifelines (drawn behind boxes) -->
  <line x1="115" y1="68" x2="115" y2="536" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="330" y1="68" x2="330" y2="536" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="555" y1="68" x2="555" y2="536" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="770" y1="68" x2="770" y2="536" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- 4 Column Headers -->
  <g transform="translate(25 18)">
    <rect width="180" height="48" rx="10" fill="#dbeefa" stroke="#37444a" stroke-width="2"/>
    <text x="90" y="22" text-anchor="middle" class="t h">前端工作台 / API</text>
    <text x="90" y="39" text-anchor="middle" class="m" font-size="10.5">ChatUI · evals</text>
  </g>
  <g transform="translate(235 18)">
    <rect width="190" height="48" rx="10" fill="#e1efdb" stroke="#37444a" stroke-width="2"/>
    <text x="95" y="22" text-anchor="middle" class="t h">Express API 层</text>
    <text x="95" y="39" text-anchor="middle" class="m" font-size="10.5">chat.js · agentRuns.js</text>
  </g>
  <g transform="translate(455 18)">
    <rect width="200" height="48" rx="10" fill="#faeaba" stroke="#37444a" stroke-width="2"/>
    <text x="100" y="22" text-anchor="middle" class="t h">Supervisor + Runtime</text>
    <text x="100" y="39" text-anchor="middle" class="m" font-size="10.5">PQueue · Executor · Graph</text>
  </g>
  <g transform="translate(680 18)">
    <rect width="180" height="48" rx="10" fill="#eae4f8" stroke="#37444a" stroke-width="2"/>
    <text x="90" y="22" text-anchor="middle" class="t h">PostgreSQL</text>
    <text x="90" y="39" text-anchor="middle" class="m" font-size="10.5">业务表 + Checkpointer</text>
  </g>

  <!-- Stage 1: Submit & Snapshot -->
  <rect x="20" y="80" width="840" height="86" rx="10" fill="#ffffff" fill-opacity="0.72" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="28" y="88" width="22" height="20" rx="5" fill="#37444a"/>
  <text x="39" y="102" text-anchor="middle" class="t badge">1</text>
  <text x="58" y="102" class="t lbl">提交与快照固化</text>

  <line x1="115" y1="120" x2="324" y2="120" stroke="#37444a" stroke-width="2" marker-end="url(#tip)"/>
  <text x="220" y="114" text-anchor="middle" class="m" font-size="10.5">stream-chat / POST agent-runs</text>

  <line x1="330" y1="128" x2="764" y2="128" stroke="#37444a" stroke-width="2" marker-end="url(#tip)"/>
  <text x="547" y="122" text-anchor="middle" class="t s">grepAgents / submitAgentRun 写 Runtime Snapshot + run.queued</text>

  <line x1="324" y1="150" x2="121" y2="150" stroke="#0369a1" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#tip-dashed)"/>
  <text x="222" y="144" text-anchor="middle" class="m" font-size="10.5">返回 runId（202 / 切换帧；冲突 409）</text>

  <!-- Stage 2: Queue, Lease & Heartbeat -->
  <rect x="20" y="176" width="840" height="82" rx="10" fill="#ffffff" fill-opacity="0.72" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="28" y="184" width="22" height="20" rx="5" fill="#37444a"/>
  <text x="39" y="198" text-anchor="middle" class="t badge">2</text>
  <text x="58" y="198" class="t lbl">队列领取、租约与心跳</text>

  <line x1="330" y1="214" x2="549" y2="214" stroke="#37444a" stroke-width="2" marker-end="url(#tip)"/>
  <text x="436" y="207" text-anchor="middle" class="t s">enqueue 入 PQueue（并发 ≤8）</text>

  <line x1="555" y1="226" x2="764" y2="226" stroke="#37444a" stroke-width="2" marker-end="url(#tip)"/>
  <text x="660" y="220" text-anchor="middle" class="t s">claim() 抢占 5m 租约</text>

  <rect x="466" y="234" width="286" height="19" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="609" y="247" text-anchor="middle" class="t" font-size="10.8">执行期每 10s 心跳续期 · 每 5s 轮询可重领任务</text>

  <!-- Stage 3: Graph Execution & Lossless SSE -->
  <rect x="20" y="268" width="840" height="104" rx="10" fill="#ffffff" fill-opacity="0.72" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="28" y="276" width="22" height="20" rx="5" fill="#37444a"/>
  <text x="39" y="290" text-anchor="middle" class="t badge">3</text>
  <text x="58" y="290" class="t lbl">图执行、事件落库与 SSE 无损续传</text>

  <line x1="555" y1="308" x2="764" y2="308" stroke="#37444a" stroke-width="2" marker-end="url(#tip)"/>
  <text x="660" y="302" text-anchor="middle" class="t s">每步写 Checkpointer + 事件落库</text>

  <line x1="115" y1="322" x2="324" y2="322" stroke="#37444a" stroke-width="2" marker-end="url(#tip)"/>
  <text x="220" y="316" text-anchor="middle" class="m" font-size="10.5">GET /events (Last-Event-ID)</text>

  <line x1="550" y1="336" x2="336" y2="336" stroke="#0369a1" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#tip-dashed)"/>
  <text x="443" y="330" text-anchor="middle" class="m" font-size="10.5">agentRunEventBus 实时事件</text>

  <line x1="324" y1="348" x2="121" y2="348" stroke="#0369a1" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#tip-dashed)"/>
  <text x="222" y="363" text-anchor="middle" class="t" font-size="10.5" fill="#0369a1">先订阅缓冲 → 查库补发 → 直推（15s 心跳）</text>

  <!-- Stage 4: Commands -->
  <rect x="20" y="382" width="840" height="66" rx="10" fill="#ffffff" fill-opacity="0.72" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="28" y="390" width="22" height="20" rx="5" fill="#37444a"/>
  <text x="39" y="404" text-anchor="middle" class="t badge">4</text>
  <text x="58" y="404" class="t lbl">运行期控制指令（可选）</text>

  <line x1="115" y1="426" x2="324" y2="426" stroke="#37444a" stroke-width="2" marker-end="url(#tip)"/>
  <text x="220" y="420" text-anchor="middle" class="m" font-size="10.5">POST /commands</text>

  <line x1="330" y1="426" x2="764" y2="426" stroke="#37444a" stroke-width="2" marker-end="url(#tip)"/>
  <text x="547" y="420" text-anchor="middle" class="t s">AgentRunCommand 幂等去重（cancel / input.respond / task.skip）→ 唤醒重入队</text>

  <!-- Stage 5: Terminal & Crash Recovery -->
  <rect x="20" y="458" width="840" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <rect x="28" y="466" width="22" height="20" rx="5" fill="#37444a"/>
  <text x="39" y="480" text-anchor="middle" class="t badge">5</text>
  <text x="58" y="480" class="t lbl">终态收尾 与 崩溃重启恢复</text>

  <g transform="translate(32 492)">
    <rect width="398" height="42" rx="8" fill="#e1efdb" stroke="#37444a" stroke-width="1.3"/>
    <text x="199" y="18" text-anchor="middle" class="t" font-size="12" font-weight="700">终态收敛（完成 / 失败 / 取消）</text>
    <text x="199" y="34" text-anchor="middle" class="t s">登记产物 · 保留部分结果写 workspace_chats · 清理检查点</text>
  </g>
  <g transform="translate(450 492)">
    <rect width="398" height="42" rx="8" fill="#f9e0d1" stroke="#37444a" stroke-width="1.3"/>
    <text x="199" y="18" text-anchor="middle" class="t" font-size="12" font-weight="700">服务重启恢复（租约过期重领）</text>
    <text x="199" y="34" text-anchor="middle" class="t s">中断工具标 WORKER_RESTARTED · 从 PG Checkpointer 续跑</text>
  </g>
</svg>
