<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" role="img" aria-labelledby="title"><title id="title">分步运行时从请求到结果的主要分支</title>
<defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r=".85" fill="#d7d0bd"/></pattern><marker id="tip" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="m2 1 8 5-8 5" fill="none" stroke="#37444a" stroke-width="2"/></marker></defs><rect width="100%" height="100%" rx="15" fill="#fffcf4"/><rect width="100%" height="100%" fill="url(#dots)"/><g stroke-linejoin="round" stroke-linecap="round" font-family="KaiTi, Kaiti SC, WenQuanYi Zen Hei, sans-serif" fill="#24353b">
<g transform="translate(236 18)"><path d="M8 2 Q124 -1 241 1 Q249 0 248 9 L247 59 Q248 67 240 66 L8 65 Q0 66 1 58 L0 9 Q0 2 8 2Z" fill="#dbeefa" stroke="#37444a" stroke-width="2"/><path d="M6 6 Q82 2 165 4" fill="none" stroke="#68777a" opacity=".4"/><text x="124" y="30" text-anchor="middle" font-size="21">准备上下文</text><text x="124" y="54" text-anchor="middle" font-size="15">请求、附件与运行配置</text></g>
<path d="M360 85 Q359 104 360 118" fill="none" stroke="#37444a" stroke-width="2" marker-end="url(#tip)"/>
<g transform="translate(236 121)"><path d="M8 2 Q124 -1 241 1 Q249 0 248 9 L247 59 Q248 67 240 66 L8 65 Q0 66 1 58 L0 9 Q0 2 8 2Z" fill="#faeaba" stroke="#37444a" stroke-width="2"/><path d="M6 6 Q82 2 165 4" fill="none" stroke="#68777a" opacity=".4"/><text x="124" y="30" text-anchor="middle" font-size="21">控制器</text><text x="124" y="54" text-anchor="middle" font-size="15">判断接下来做什么</text></g>
<path d="M360 190 Q362 208 124 212 L124 237" fill="none" stroke="#37444a" stroke-width="2" marker-end="url(#tip)"/>
<g transform="translate(19 240)"><path d="M8 2 Q105 -1 203 1 Q211 0 210 9 L209 59 Q210 67 202 66 L8 65 Q0 66 1 58 L0 9 Q0 2 8 2Z" fill="#e1efdb" stroke="#37444a" stroke-width="2"/><path d="M6 6 Q70 2 140 4" fill="none" stroke="#68777a" opacity=".4"/><text x="105" y="30" text-anchor="middle" font-size="21">直接完成</text><text x="105" y="54" text-anchor="middle" font-size="15">回答或执行固定转换</text></g>
<path d="M360 190 Q362 208 360 212 L360 237" fill="none" stroke="#37444a" stroke-width="2" marker-end="url(#tip)"/>
<g transform="translate(255 240)"><path d="M8 2 Q105 -1 203 1 Q211 0 210 9 L209 59 Q210 67 202 66 L8 65 Q0 66 1 58 L0 9 Q0 2 8 2Z" fill="#faeaba" stroke="#37444a" stroke-width="2"/><path d="M6 6 Q70 2 140 4" fill="none" stroke="#68777a" opacity=".4"/><text x="105" y="30" text-anchor="middle" font-size="21">制定计划</text><text x="105" y="54" text-anchor="middle" font-size="15">列出任务与依赖</text></g>
<path d="M360 190 Q362 208 596 212 L596 237" fill="none" stroke="#37444a" stroke-width="2" marker-end="url(#tip)"/>
<g transform="translate(491 240)"><path d="M8 2 Q105 -1 203 1 Q211 0 210 9 L209 59 Q210 67 202 66 L8 65 Q0 66 1 58 L0 9 Q0 2 8 2Z" fill="#f9e0d1" stroke="#37444a" stroke-width="2"/><path d="M6 6 Q70 2 140 4" fill="none" stroke="#68777a" opacity=".4"/><text x="105" y="30" text-anchor="middle" font-size="21">需要补充输入</text><text x="105" y="54" text-anchor="middle" font-size="15">收到回答后回到控制器</text></g>
<path d="M360 308 L360 343" fill="none" stroke="#37444a" stroke-width="2" marker-end="url(#tip)"/>
<g transform="translate(235 347)"><path d="M8 2 Q125 -1 243 1 Q251 0 250 9 L249 59 Q250 67 242 66 L8 65 Q0 66 1 58 L0 9 Q0 2 8 2Z" fill="#e1efdb" stroke="#37444a" stroke-width="2"/><path d="M6 6 Q83 2 166 4" fill="none" stroke="#68777a" opacity=".4"/><text x="125" y="30" text-anchor="middle" font-size="21">调度与执行</text><text x="125" y="54" text-anchor="middle" font-size="15">运行就绪任务，收集结果</text></g>
<path d="M360 415 L360 446" fill="none" stroke="#37444a" stroke-width="2" marker-end="url(#tip)"/>
<g transform="translate(235 450)"><path d="M8 2 Q125 -1 243 1 Q251 0 250 9 L249 59 Q250 67 242 66 L8 65 Q0 66 1 58 L0 9 Q0 2 8 2Z" fill="#dbeefa" stroke="#37444a" stroke-width="2"/><path d="M6 6 Q83 2 166 4" fill="none" stroke="#68777a" opacity=".4"/><text x="125" y="30" text-anchor="middle" font-size="21">检查并汇总</text><text x="125" y="54" text-anchor="middle" font-size="15">接受、补做或说明缺口</text></g>
<path d="M486 483 Q530 484 532 452 L532 390 Q530 380 488 380" fill="none" stroke="#37444a" stroke-width="2" marker-end="url(#tip)"/>
<text x="599" y="444" text-anchor="middle" font-size="15">有可补做的任务</text>
</g></svg>
