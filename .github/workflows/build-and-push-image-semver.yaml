name: Publish versioned CoreGenie image
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v1.15.1
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the already published commit image
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          image="ghcr.io/${REPOSITORY,,}"
          commit="$(git rev-parse HEAD)"
          repositories=("$image")
          if grep -q '^ENV DEPLOYMENT_VERSION=' sandbox/Dockerfile.broker; then
            repositories+=("$image-sandbox-broker")
          fi
          for repository in "${repositories[@]}"; do
            docker buildx imagetools create \
              --tag "$repository:${RELEASE_TAG#v}" \
              --tag "$repository:$RELEASE_TAG" \
              "$repository:sha-$commit"
          done
