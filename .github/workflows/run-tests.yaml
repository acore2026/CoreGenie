name: Run backend tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".nvmrc"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/run-tests.yaml"
      - "jest.config.cjs"
      - "server/**"
      - "collector/**"

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache root dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/yarn
          key: ${{ runner.os }}-node24-yarn-root-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node24-yarn-root-

      - name: Cache server dependencies
        uses: actions/cache@v4
        with:
          path: |
            server/node_modules
            ~/.cache/yarn
          key: ${{ runner.os }}-node24-yarn-server-${{ hashFiles('server/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node24-yarn-server-

      - name: Cache collector dependencies
        uses: actions/cache@v4
        with:
          path: |
            collector/node_modules
            ~/.cache/yarn
          key: ${{ runner.os }}-node24-yarn-collector-${{ hashFiles('collector/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node24-yarn-collector-

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Install server dependencies
        run: cd server && yarn install --frozen-lockfile

      - name: Install collector dependencies
        run: cd collector && yarn install --frozen-lockfile
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "true"

      - name: Setup environment and Prisma
        run: yarn setup:envs && yarn prisma:setup

      - name: Run test suites
        run: yarn test

      - name: Fail job on error
        if: failure()
        run: exit 1
