name: Lint

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".nvmrc"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/lint.yaml"
      - "server/**"
      - "collector/**"
      - "frontend/**"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache server dependencies
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: ${{ runner.os }}-node24-yarn-server-${{ hashFiles('server/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node24-yarn-server-

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node24-yarn-frontend-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node24-yarn-frontend-

      - name: Cache collector dependencies
        uses: actions/cache@v4
        with:
          path: collector/node_modules
          key: ${{ runner.os }}-node24-yarn-collector-${{ hashFiles('collector/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node24-yarn-collector-

      - name: Install server dependencies
        run: cd server && yarn install --frozen-lockfile

      - name: Install frontend dependencies
        run: cd frontend && yarn install --frozen-lockfile

      - name: Install collector dependencies
        run: cd collector && yarn install --frozen-lockfile
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "true"

      - name: Lint server
        run: cd server && yarn lint:check

      - name: Lint frontend
        run: cd frontend && yarn lint:check

      - name: Lint collector
        run: cd collector && yarn lint:check

      - name: Build frontend and check server entry assets
        working-directory: frontend
        run: |
          yarn build
          test -s dist/_index.html && test -s dist/index.js && test -s dist/index.css

      - name: Run frontend unit tests
        working-directory: frontend
        run: yarn test:unit

      - name: Run browser regression tests
        working-directory: frontend
        run: |
          yarn playwright install --with-deps chromium
          yarn test:proposal-fill
          yarn test:agent-admin
