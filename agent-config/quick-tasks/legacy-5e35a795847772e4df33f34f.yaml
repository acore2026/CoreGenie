id: legacy-5e35a795847772e4df33f34f
title: 比较公司方案
description: 选择关注的公司，对比技术路线和关键差异。
instructions: 请按所选会议与 官方 KI比较各公司的 3GPP 提案，输出技术路线对比表，解释关键差异。 生成中文 Markdown 报告，并列出所用 TDoc 和会议材料。区分公司提案与会议已通过的结论。手动填写的会议和议题要先查官方资料确认；资料缺失时明确说明，不要猜测。 所选 KI 来自列明 TR 版本的官方研究报告，中文标题和说明为简述。使用时保留 TR、版本和章节，不得跨项目套用编号；KI 是研究问题，不代表相关方案已被采纳。手动补充的 KI 须先查原文确认。
version: 1
fields:
  - id: group
    type: single
    label: 工作组
    hint: 核心网相关组默认显示；其他工作组可展开选择。选择后显示已收录的官方 KI，会议列表自动读取。
    required: true
    optionGroups:
      - id: core
        label: 核心网相关
        description: 架构、安全、管理计费及核心网协议工作组。
      - id: other
        label: 其他工作组
        description: 包括需求、媒体、应用、卡和无线接入网工作组。
        collapsed: true
    options:
      - value: SA2
        label: SA2
        description: 核心网总体架构、网络功能及流程（Stage 2）。
        group: core
      - value: SA3
        label: SA3
        description: 安全与隐私，包括认证、授权和接口安全。
        group: core
      - value: SA5
        label: SA5
        description: 管理、编排与计费，包括网元、切片和运维。
        group: core
      - value: CT1
        label: CT1
        description: 终端与核心网协议，包括 NAS、注册、移动性和会话管理。
        group: core
      - value: CT3
        label: CT3
        description: 外部网络互通、策略与计费控制协议。
        group: core
      - value: CT4
        label: CT4
        description: 核心网内部协议，包括 SBI、GTP、PFCP 和网元间接口。
        group: core
      - value: SA
        label: SA
        description: SA 全会，协调并批准 SA 各工作组成果。
        group: other
      - value: SA1
        label: SA1
        description: 业务场景和服务需求（Stage 1）。
        group: other
      - value: SA4
        label: SA4
        description: 语音、音频、视频编解码及多媒体系统。
        group: other
      - value: SA6
        label: SA6
        description: 应用使能与关键通信应用，不负责通用核心网架构。
        group: other
      - value: CT
        label: CT
        description: CT 全会，协调并批准核心网与终端协议成果。
        group: other
      - value: CT6
        label: CT6
        description: USIM、ISIM 等智能卡应用及终端与卡的交互。
        group: other
      - value: RAN
        label: RAN
        description: 无线接入网全会。
        group: other
      - value: RAN1
        label: RAN1
        description: 无线物理层。
        group: other
      - value: RAN2
        label: RAN2
        description: 无线接口层 2 和层 3 协议。
        group: other
      - value: RAN3
        label: RAN3
        description: 无线接入网架构及网元间接口。
        group: other
      - value: RAN4
        label: RAN4
        description: 无线性能和射频要求。
        group: other
      - value: RAN5
        label: RAN5
        description: 终端一致性测试。
        group: other
  - id: meeting
    type: meeting
    groupField: group
    label: 会议
    hint: 按年份选择官方资料目录中的会议；上一次／下一次切换相邻场次。列表不代表完整会议日历，尚未建立资料目录的会议可手动填写。
