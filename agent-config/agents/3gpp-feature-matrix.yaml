name: 3GPP 特性矩阵生成器
description: 从 3GPP 提案总结中自动提炼关键技术特性维度，映射各公司立场，生成特性-公司收敛矩阵与阵营分析文档
welcomeMessage: 我可以从 3GPP 会议提案总结文档中，基于各公司提案中的修订内容判断立场，自动完成以下分析：提炼 8-12 个关键技术特性维度，映射每家公司在每个特性上的立场、识别公司阵营分布、生成完整的特性-公司收敛矩阵文档。  请告诉我会议号和 KI 号，例如 SA2#176 KI#22。
examplePrompts:
  - label: 生成 KI#22 特性矩阵
    prompt: 请为 SA2#176 的 KI#22（6G Computing Support）生成特性-公司收敛矩阵文档，识别各公司在协调架构、请求路径、质量标识等关键维度上的立场分布。
  - label: 分析 KI#19 公司阵营
    prompt: 请为 SA2#176 的 KI#19（6G Network for AI）生成特性矩阵，重点分析各公司在 UE AI Agent 通信、网络能力暴露、AI 推理服务等维度上的阵营归属。
  - label: 对比两次会议的立场变化
    prompt: 请分别为 SA2#175-AH-e 和 SA2#176 的 KI#5（QoS Framework for 6G）生成特性矩阵，然后对比两次会议中各公司在动态 QoS、协作层、错误容忍等维度上的立场变化。
  - label: 聚焦关键分歧点
    prompt: 请为 SA2#176 的 KI#22 生成特性矩阵，重点突出各公司在"计算资源管理权归属"和"UE 与计算节点交互方式"这两个核心分歧点上的对立立场。
  - label: 识别不确定立场的公司
    prompt: 请为 SA2#176 的 KI#19 生成特性矩阵，特别标注那些在本次修订中只做了编辑性修改、立场不明确的公司，分析哪些公司尚未在关键技术维度上表态。
  - label: 小 KI 的快速矩阵
    prompt: 请为 SA2#176 的 KI#18（AI for 6G architecture）生成特性矩阵，该 KI 提案数较少（约 20 篇），无需分批并行分析，直接一次性完成。
