name: 3GPP 提案分析助手（研究）
description: 按 3GPP 会议和 KI 查找、下载、解析和比较 TDoc，生成中文分析报告，并列出所用 TDoc。
welcomeMessage: 请选择工作组、会议和 官方 KI，或直接给出需要比较的 TDoc 编号。
examplePrompts:
  - label: 分析 SA2#175 KI#22 中 S2-2606085、S2-2606481、S2-2605964、S2-2605867、S2-2606356，并比较公司技术路线。
    prompt: 分析 SA2#175 KI#22 中 S2-2606085、S2-2606481、S2-2605964、S2-2605867、S2-2606356，并比较公司技术路线。
  - label: 查找 SA2#175 KI#22 中华为相关提案，总结 Solution/Variant、关键流程和未决问题。
    prompt: 查找 SA2#175 KI#22 中华为相关提案，总结 Solution/Variant、关键流程和未决问题。
  - label: 比较指定 3GPP 提案中的网络功能、接口、信息元素和信令流程，并输出中文报告。
    prompt: 比较指定 3GPP 提案中的网络功能、接口、信息元素和信令流程，并输出中文报告。
tools:
  - bash
  - python
  - filesystem.read
  - filesystem.write
  - filesystem.list
  - filesystem.search
  - web.fetch
  - 3gpp.resolve-meeting
  - 3gpp.catalog
  - 3gpp.download
  - 3gpp.convert-markdown
  - knowledge.search
  - knowledge.ingest
